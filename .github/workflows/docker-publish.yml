# Builds the backend and frontend Docker images and publishes them to the
# GitHub Container Registry, so users can `docker compose up` without building.
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
#   -> ghcr.io/<owner>/mldock-backend:1.0.0, :1.0, :latest  (same for frontend)
# Manual:   Actions tab -> "Publish Docker images" -> Run workflow
#   -> tagged with the branch name, e.g. :main

name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mldock-backend
            context: ./backend
            # amd64 only: the ML stack is large and slow to build under arm64 emulation.
            # Apple Silicon Macs run this image fine through Docker Desktop's emulation.
            # Add ",linux/arm64" here if you want native ARM servers (e.g. Raspberry Pi, Graviton).
            platforms: linux/amd64
          - image: mldock-frontend
            context: ./frontend
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; GitHub usernames may not be
      - name: Lowercase image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          # v1.2.3 -> 1.2.3, 1.2 and latest; manual runs -> branch name
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs so unchanged dependencies aren't reinstalled
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
